<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackWise</title>
</head>
<body>
    <header>
        <button id="symbol">☰</button>
        <nav>
            <ul>
                <li><button class="link" id="Home">🏠Home</button></li>
                <li><button class="link" id="Add">Add</button></li>
                <li><button class="link" id="reports">reports</button></li>
                <li><button class="link" id="History">your History</button></li>
                <li><button class="link" id="settings">Setting</button></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="home-sec" >
            <div class="title">
                <h1>Track <span>wise</span> </h1>
                <p>Take control of your balance</p>
            </div>
            <div class="informations">
                <div class="info" id="corrent">
                    <p></p>
                </div>
                <div class="info" id="total-income">
                    <p></p>
                </div>
                <div class="info" id="total-expenses">
                    <p></p>
                </div>
                <div class="info" id="recent">
                    <p></p>
                </div>
            </div>
            <div class="About" >
                <img src="photos/photo1.jpg" alt="balance">
                <h2>How to control your balance wisely</h2>
                <p></p>
            </div>
            

        </section>
        <section id="add">

            <h2>Add <span>Process</span></h2>
            <form>
                <h2>Your process info </h2>
                <label for="amount">Amount</label>
                <input
                class="adding-info"
                type="number" 
                id="amount" 
                name="amount" 
                required 
                maxlength="9"
                placeholder="100000000">
                <label for="category">Category</label>
                <input
                class="adding-info" 
                type="text"
                id = "category"
                name="category"
                required
                placeholder="Food">
                <label for="date">Date</label>
                <input
                class="adding-info" 
                type="date" 
                id="date"
                name="date"
                placeholder="Enter the date"
                required>
                <label for="note">Note</label>
                <input 
                class="adding-info"
                type="text" 
                id="note"
                name="note"
                placeholder="Enter your Note">
                <label for="time">Time</label>
                <input 
                class="adding-info"
                type="time" 
                id="time"
                name="time"
                placeholder=""
                required
                pattern="[110]+">
                <fieldset>
                    <legend>Enter your process type</legend>
                    <label for="income">Income</label>
                    <input type="radio" id="income" name="income" required >
                    <label for="expense">Expense</label>
                    <input type="radio" id="expense" name="expense" required>
                </fieldset>
                <button type="submit" id="submitbtn">Submit</button>
            </form>
        </section>
        <section id="history">
            <h2>Your Financial transaction History </h2>
            <img src="photos/historyph.jpg" alt="photo for mony">
            <div id="transactions">
            </div>
            <!-- Tomorrow I will add the buttons here   -->
        </section>
    </main>
    
</body>
</html>
